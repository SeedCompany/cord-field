fragment promptResponseList on PromptVariantResponseList {
  canCreate
  canRead
  total
  hasMore
  items {
    ...promptResponse
  }

  available {
    prompts {
      ...Prompt
    }
    variants {
      ...variant
    }
  }
}

fragment promptResponse on PromptVariantResponse {
  id
  prompt {
    ...SecuredPrompt
  }
  responses {
    ...variantResponse
  }
  # Meaningful only where a parent can hold several items and one needs to be
  # singled out for an audience that wants exactly one -- today, choosing the
  # community story that represents a report to investors. Harmless noise on
  # the other three PromptVariantResponse kinds, which never set it.
  featured {
    canRead
    canEdit
    value
  }
  canDelete
}

fragment variantResponse on VariantResponse {
  variant {
    ...variant
  }
  response {
    canRead
    canEdit
    value
  }
  modifiedAt
}
