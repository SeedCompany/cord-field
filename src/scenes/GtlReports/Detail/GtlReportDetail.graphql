query GtlReportDetail($id: ID!) {
  periodicReport(id: $id) {
    ...gtlReportDetail
  }
}

fragment gtlReportDetail on GTLReport {
  id
  start
  end
  due
  status {
    canRead
    value
  }
  parent {
    id
    ... on InternshipEngagement {
      id
      ...EngagementBreadcrumb
      programProgress {
        value
      }
      intern {
        value {
          id
          fullName
        }
      }
      project {
        ...ProjectBreadcrumb
        name {
          value
        }
      }
    }
  }
  transitions {
    key
    label
    to
    type
    canExecute
  }
  previousQuarterGoals {
    ...gtlGoal
  }
  goals {
    ...gtlGoal
  }
  practicums {
    ...gtlPracticum
  }
  communityImpact {
    ...promptResponseList
  }
  praises {
    ...promptResponseList
  }
  petitions {
    ...promptResponseList
  }
  progressExplanation {
    status {
      canRead
      canEdit
      value
    }
    context {
      canRead
      canEdit
      value
    }
  }
}

fragment gtlGoal on GtlReportGoal {
  id
  goal {
    value
    canEdit
  }
  details {
    value
    canEdit
  }
  met {
    value
    canEdit
  }
  impact {
    value
    canEdit
  }
}

fragment gtlPracticum on GtlReportPracticum {
  id
  involvement {
    value
    canEdit
  }
  outcomes {
    value
    canEdit
  }
  mentor {
    value {
      id
      fullName
    }
  }
}

mutation ExecuteGtlReportTransition($input: ExecuteGtlReportTransition!) {
  executeGtlReportTransition(input: $input) {
    ...gtlReportDetail
  }
}

mutation CreateGtlReportGoal($input: CreateGtlReportGoal!) {
  createGtlReportGoal(input: $input) {
    gtlReportGoal {
      ...gtlGoal
    }
  }
}

mutation UpdateGtlReportGoal($input: UpdateGtlReportGoal!) {
  updateGtlReportGoal(input: $input) {
    gtlReportGoal {
      ...gtlGoal
    }
  }
}

mutation ReviewGtlReportGoal($input: ReviewGtlReportGoal!) {
  reviewGtlReportGoal(input: $input) {
    gtlReportGoal {
      ...gtlGoal
    }
  }
}

mutation DeleteGtlReportGoal($id: ID!) {
  deleteGtlReportGoal(id: $id) {
    __typename
  }
}

mutation CreateGtlReportPracticum($input: CreateGtlReportPracticum!) {
  createGtlReportPracticum(input: $input) {
    gtlReportPracticum {
