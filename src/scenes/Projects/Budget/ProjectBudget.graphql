fragment BudgetRecord on BudgetRecord {
  ...Id
  createdAt
  amount {
    canEdit
    canRead
    value
  }
  preApprovedAmount {
    value
    canEdit
    canRead
  }
  initialAmount {
    value
    canEdit
    canRead
  }
  fiscalYear {
    canEdit
    canRead
    value
  }
  organization {
    canEdit
    canRead
    value {
      id
      createdAt
      name {
        canEdit
        canRead
        value
      }
    }
  }
}

query ProjectBudget($id: ID!, $changeset: ID) @live {
  project(id: $id, changeset: $changeset) {
    id
    ...ProjectBreadcrumb
    name {
      canRead
      value
    }

    # ── budget-line-items-poc additions (frontend-only, item 7) ──
    # Project MOU dates, shown read-only near the top of the Budget page,
    # distinct from anything budget-specific. Field-selection shape matches
    # `projectDataGridRow.graphql`'s existing use of these same fields.
    mouStart {
      value
    }
    mouEnd {
      value
    }

    # ── budget-line-items-poc additions (frontend-only, item 2) ──
    # This project's own partnerships, scoped (not a global org search) --
    # sourced for the Service Provider / Funder / Donor grid-column pickers.
    partnerships {
      items {
        partner {
          value {
            organization {
              value {
                id
                name {
                  value
                }
              }
            }
          }
        }
      }
    }

    # ── budget-line-items-poc additions (frontend-only, item 4) ──
    # Best-effort primary-funder name for the "Total cash — {funder}" stats
    # row. `Project.primaryPartnership` already exists in the schema (no
    # backend change), but resolves to null under the current
    # Postgres/Drizzle path (see budget.resolver.ts's comment) -- the UI
    # falls back to a generic "Primary Funder" label when this is null.
    primaryPartnership {
      value {
        partner {
          value {
            organization {
              value {
                id
                name {
                  value
                }
              }
            }
          }
        }
      }
    }

    budget {
      canRead
      canEdit
      value {
        ...BudgetOverview
        records {
          ...BudgetRecord
        }
        status
        universalTemplateFile {
          canEdit
          canRead
          value {
            ...FileNodeInfo
          }
        }

        # ── budget-line-items-poc additions ──
        # `sensitivity` (item 2): drives the benchmark-calculator modal's
        # "rate hidden at High sensitivity" masking -- a plain, ungated enum
        # field (not `Secured*`), so no canRead/canEdit sub-selection.
        sensitivity
        country {
          canRead
          canEdit
          value {
            ...BudgetReferenceCountry
          }
        }
        entryCurrencyMode {
          canRead
          canEdit
          value
        }
        displayCurrencyMode {
          canRead
          canEdit
          value
        }
        exchangeRate {
          canRead
          canEdit
          value
        }
        inflationRate {
          canRead
          canEdit
          value
        }
        adminFeePercent {
          canRead
          canEdit
          value
        }
        languageCount {
          canRead
          canEdit
          value
        }
        lineItems {
          ...BudgetLineItem
        }
        otherPartnerContributions {
          ...OtherPartnerContribution
        }
        calculationSummary {
          ...BudgetCalculationSummary
        }
      }
    }
  }
}

# budget-line-items-poc: separate mutation (rather than reusing
# UpdateProjectBudgetUniversalTemplate) since it targets a distinct set of
# fields (the assumptions form) with no file upload involved.
mutation UpdateBudgetAssumptions($input: UpdateBudget!) {
  updateBudget(input: $input) {
    budget {
      ...Id
      country {
        canRead
        canEdit
        value {
          ...BudgetReferenceCountry
        }
      }
      entryCurrencyMode {
        canRead
        canEdit
        value
      }
      displayCurrencyMode {
        canRead
        canEdit
        value
      }
      exchangeRate {
        canRead
        canEdit
        value
      }
      inflationRate {
        canRead
        canEdit
        value
      }
      adminFeePercent {
        canRead
        canEdit
        value
      }
      languageCount {
        canRead
        canEdit
        value
      }
      calculationSummary {
        ...BudgetCalculationSummary
      }
    }
  }
}

mutation UpdateProjectBudgetUniversalTemplate(
  $id: ID!
  $upload: CreateDefinedFileVersion!
) {
  updateBudget(input: { id: $id, universalTemplateFile: $upload }) {
    budget {
      ...Id
      universalTemplateFile {
        value {
          ...FileNodeInfo
          children {
            items {
              ...FileNodeInfo
            }
          }
        }
      }
    }
  }
}

mutation UpdateProjectBudgetRecord($input: UpdateBudgetRecord!) {
  updateBudgetRecord(input: $input) {
    budgetRecord {
      ...Id
      amount {
        value
      }
      preApprovedAmount {
        value
      }
      initialAmount {
        value
      }
      ...RecalculateChangesetDiff
    }
  }
}

fragment CalculateNewTotalAndRollup on Budget {
  ...Id
  total
  summary {
    hasPreApproved
    preApprovedExceeded
  }
  records {
    ...Id
    amount {
      value
    }
    preApprovedAmount {
      value
    }
    initialAmount {
      value
    }
  }
}
