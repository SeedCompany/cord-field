fragment BudgetRecord on BudgetRecord {
  ...Id
  createdAt
  amount {
    canEdit
    canRead
    value
  }
  preApprovedAmount {
    value
    canEdit
    canRead
  }
  initialAmount {
    value
    canEdit
    canRead
  }
  fiscalYear {
    canEdit
    canRead
    value
  }
  organization {
    canEdit
    canRead
    value {
      id
      createdAt
      name {
        canEdit
        canRead
        value
      }
    }
  }
}

query ProjectBudget($id: ID!, $changeset: ID) @live {
  project(id: $id, changeset: $changeset) {
    id
    ...ProjectBreadcrumb
    name {
      canRead
      value
    }
    budget {
      canRead
      canEdit
      value {
        ...BudgetOverview
        records {
          ...BudgetRecord
        }
        status
        universalTemplateFile {
          canEdit
          canRead
          value {
            ...FileNodeInfo
          }
        }

        # ── budget-line-items-poc additions ──
        country {
          canRead
          canEdit
          value {
            ...BudgetReferenceCountry
          }
        }
        entryCurrencyMode {
          canRead
          canEdit
          value
        }
        displayCurrencyMode {
          canRead
          canEdit
          value
        }
        exchangeRate {
          canRead
          canEdit
          value
        }
        inflationRate {
          canRead
          canEdit
          value
        }
        adminFeePercent {
          canRead
          canEdit
          value
        }
        languageCount {
          canRead
          canEdit
          value
        }
        lineItems {
          ...BudgetLineItem
        }
        otherPartnerContributions {
          ...OtherPartnerContribution
        }
        calculationSummary {
          ...BudgetCalculationSummary
        }
      }
    }
  }
}

# budget-line-items-poc: separate mutation (rather than reusing
# UpdateProjectBudgetUniversalTemplate) since it targets a distinct set of
# fields (the assumptions form) with no file upload involved.
mutation UpdateBudgetAssumptions($input: UpdateBudget!) {
  updateBudget(input: $input) {
    budget {
      ...Id
      country {
        canRead
        canEdit
        value {
          ...BudgetReferenceCountry
        }
      }
      entryCurrencyMode {
        canRead
        canEdit
        value
      }
      displayCurrencyMode {
        canRead
        canEdit
        value
      }
      exchangeRate {
        canRead
        canEdit
        value
      }
      inflationRate {
        canRead
        canEdit
        value
      }
      adminFeePercent {
        canRead
        canEdit
        value
      }
      languageCount {
        canRead
        canEdit
        value
      }
      calculationSummary {
        ...BudgetCalculationSummary
      }
    }
  }
}

mutation UpdateProjectBudgetUniversalTemplate(
  $id: ID!
  $upload: CreateDefinedFileVersion!
) {
  updateBudget(input: { id: $id, universalTemplateFile: $upload }) {
    budget {
      ...Id
      universalTemplateFile {
        value {
          ...FileNodeInfo
          children {
            items {
              ...FileNodeInfo
            }
          }
        }
      }
    }
  }
}

mutation UpdateProjectBudgetRecord($input: UpdateBudgetRecord!) {
  updateBudgetRecord(input: $input) {
    budgetRecord {
      ...Id
      amount {
        value
      }
      preApprovedAmount {
        value
      }
      initialAmount {
        value
      }
      ...RecalculateChangesetDiff
    }
  }
}

fragment CalculateNewTotalAndRollup on Budget {
  ...Id
  total
  summary {
    hasPreApproved
    preApprovedExceeded
  }
  records {
    ...Id
    amount {
      value
    }
    preApprovedAmount {
      value
    }
    initialAmount {
      value
    }
  }
}
