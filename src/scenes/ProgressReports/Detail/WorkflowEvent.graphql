fragment workflowEvent on ProgressReportWorkflowEvent {
  id
  at
  status
  transition {
    to
    label
    type
  }
  notes {
    canEdit
    canRead
    value
  }
  who {
    canEdit
    canRead
    value {
      id
      # `who` is an Actor interface now — a transition can be executed by a
      # SystemAgent as well as a person, and only the User arm has a name.
      ... on User {
        fullName
      }
    }
  }
}
