fragment workflowEvent on ProgressReportWorkflowEvent {
  id
  at
  status
  transition {
    to
    label
    type
  }
  notes {
    canEdit
    canRead
    value
  }
  who {
    canEdit
    canRead
    value {
      __typename
      ... on User {
        id
        fullName
      }
      ... on SystemAgent {
        id
        name
      }
    }
  }
}
