fragment progressReportMedia on ProgressReportMedia {
  variant {
    ...variant
  }
  variantGroup
  id
  category
  media {
    id
    ...anyMedia
  }
  canEdit
  canDelete
}

fragment anyMedia on Media {
  id
  mimeType
  caption
  url
  ... on VisualMedia {
    dimensions {
      aspectRatio
      height
      width
    }
  }
  ... on TemporalMedia {
    duration
  }
}
