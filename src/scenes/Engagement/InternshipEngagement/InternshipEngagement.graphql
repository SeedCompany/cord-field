fragment InternshipEngagementDetail on InternshipEngagement {
  ...Id
  ...EngagementBreadcrumb
  programProgress {
    value
  }
  currentGtlReportDue {
    value {
      id
      start
      end
      due
      status {
        value
      }
    }
  }
  nextGtlReportDue {
    value {
      id
      start
      end
      due
      status {
        value
      }
    }
  }
  gtlReports {
    total
  }
  goalProgress {
    total
    met
    unmet
    awaitingReview
    goals {
      id
      goal {
        value
      }
      details {
        value
      }
      met {
        value
      }
      impact {
        value
      }
    }
  }
  createdAt
  status {
    value
    canRead
  }
  modifiedAt
  intern {
    value {
      id
      fullName
      gender {
        value
      }
    }
  }
  position {
    canRead
    canEdit
    value
  }
  dateRange {
    ...securedDateRange
  }
  completeDate {
    value
    canRead
    canEdit
  }
  disbursementCompleteDate {
    value
    canRead
    canEdit
  }
  marketable {
    value
    canRead
    canEdit
  }
  webId {
    value
    canRead
    canEdit
  }
  countryOfOrigin {
    canRead
    canEdit
    value {
      ...DisplayLocation
    }
  }
  mentor {
    ...MentorCard
    # Needed for edit. Should this be moved?
    value {
      ...UserLookupItem
    }
  }
  ceremony {
    ...CeremonyCard
  }
  methodologies {
    ...MethodologiesCard
  }
  ...EngagementDescription
  ...EditEngagement
}
