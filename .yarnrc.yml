nodeLinker: node-modules

logFilters:
  # discard these messages that flood the build log
  - { code: YN0013, level: '${VERBOSE_YARN_LOG:-info}' } # fetching package
  - { code: YN0019, level: '${VERBOSE_YARN_LOG:-info}' } # unused cache entry
  # discard skipped build script message. We've explicitly disabled these for individual packages
  - { code: YN0005, level: discard }

packageExtensions:
  '@graphql-codegen/cli@*':
    peerDependencies:
      '@types/node': '*'
      'typescript': '*'
  '@graphql-codegen/named-operations-object@*':
    peerDependenciesMeta:
      # It doesn't actually use this peer dep
      graphql-tag: { optional: true }
  '@n1ru4l/graphql-live-query@*':
    peerDependencies:
      'tslib': '*'
  '@whatwg-node/fetch@*':
    peerDependenciesMeta:
      '@types/node': { optional: true }
  'ahooks@*':
    peerDependencies:
      '@babel/runtime': '*'
  'graphql-config@*':
    peerDependencies:
      '@types/node': '*'
      'typescript': '*'
  'react-editor-js@*':
    peerDependencies:
      react: '*'
      '@editorjs/editorjs': '*'
      '@editorjs/paragraph': '*'
  # `react-pdf@5` ships `file-loader` as a real dependency, and file-loader
  # peer-depends on webpack. Nothing requires it at runtime — it is a build-time
  # loader — but with webpack gone from devDependencies the unmet peer is
  # otherwise reported on every install. Declared on `file-loader`, not
  # `react-pdf`: react-pdf itself never declares a webpack peer, so an
  # extension there is a no-op.
  'file-loader@*':
    peerDependenciesMeta:
      webpack: { optional: true }
